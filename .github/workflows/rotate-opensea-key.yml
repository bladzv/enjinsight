name: Rotate OpenSea API Key

on:
  schedule:
    - cron: '0 3 1,21 * *'
  workflow_dispatch:

jobs:
  rotate-opensea-key:
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read

    steps:
      - name: Request new OpenSea instant key
        id: opensea
        run: |
          set -euo pipefail
          RESPONSE="$(curl -sS -X POST https://api.opensea.io/api/v2/auth/keys)"
          API_KEY="$(printf '%s' "$RESPONSE" | jq -r '.api_key // empty')"
          EXPIRES_AT="$(printf '%s' "$RESPONSE" | jq -r '.expires_at // empty')"

          if [ -z "$API_KEY" ] || [ -z "$EXPIRES_AT" ]; then
            echo "OpenSea key creation failed (response withheld to avoid leaking partial secrets)."
            exit 1
          fi

          echo "::add-mask::$API_KEY"
          echo "::add-mask::$EXPIRES_AT"
          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"
          echo "expires_at=$EXPIRES_AT" >> "$GITHUB_OUTPUT"

      - name: Upsert OPENSEA_API_KEY in Vercel production env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          NEW_VALUE: ${{ steps.opensea.outputs.api_key }}
          KEY_NAME: OPENSEA_API_KEY
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "ERROR: VERCEL_TOKEN and VERCEL_PROJECT_ID secrets must be set."
            exit 1
          fi
          BASE_URL="https://api.vercel.com"
          TEAM_QUERY=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then TEAM_QUERY="?teamId=${VERCEL_TEAM_ID}"; fi

          ENVS_JSON="$(curl --fail-with-body -sS -X GET \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${BASE_URL}/v9/projects/${VERCEL_PROJECT_ID}/env${TEAM_QUERY}")"

          IDS=$(echo "$ENVS_JSON" | jq -r --arg key "$KEY_NAME" '.envs[] | select(.key==$key) | .id // empty')
          for ID in $IDS; do
            HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${BASE_URL}/v9/projects/${VERCEL_PROJECT_ID}/env/${ID}${TEAM_QUERY}" || true)
            if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ] && [ "$HTTP_STATUS" != "404" ]; then
              echo "ERROR: DELETE env id=${ID} returned HTTP ${HTTP_STATUS}"
              exit 1
            fi
          done

          BODY=$(jq -nc --arg k "$KEY_NAME" --arg v "$NEW_VALUE" \
            '{key:$k, value:$v, type:"encrypted", target:["production"]}')
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BASE_URL}/v10/projects/${VERCEL_PROJECT_ID}/env${TEAM_QUERY}" \
            --data "$BODY" >/dev/null

      - name: Upsert OPENSEA_API_KEY_EXPIRES_AT in Vercel production env
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          NEW_VALUE: ${{ steps.opensea.outputs.expires_at }}
          KEY_NAME: OPENSEA_API_KEY_EXPIRES_AT
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_PROJECT_ID}" ]; then
            echo "ERROR: VERCEL_TOKEN and VERCEL_PROJECT_ID secrets must be set."
            exit 1
          fi
          BASE_URL="https://api.vercel.com"
          TEAM_QUERY=""
          if [ -n "${VERCEL_TEAM_ID:-}" ]; then TEAM_QUERY="?teamId=${VERCEL_TEAM_ID}"; fi

          ENVS_JSON="$(curl --fail-with-body -sS -X GET \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            "${BASE_URL}/v9/projects/${VERCEL_PROJECT_ID}/env${TEAM_QUERY}")"

          IDS=$(echo "$ENVS_JSON" | jq -r --arg key "$KEY_NAME" '.envs[] | select(.key==$key) | .id // empty')
          for ID in $IDS; do
            HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              "${BASE_URL}/v9/projects/${VERCEL_PROJECT_ID}/env/${ID}${TEAM_QUERY}" || true)
            if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "204" ] && [ "$HTTP_STATUS" != "404" ]; then
              echo "ERROR: DELETE env id=${ID} returned HTTP ${HTTP_STATUS}"
              exit 1
            fi
          done

          BODY=$(jq -nc --arg k "$KEY_NAME" --arg v "$NEW_VALUE" \
            '{key:$k, value:$v, type:"encrypted", target:["production"]}')
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            "${BASE_URL}/v10/projects/${VERCEL_PROJECT_ID}/env${TEAM_QUERY}" \
            --data "$BODY" >/dev/null

      - name: Summary
        run: |
          echo "Rotated OpenSea API key and updated production env values in Vercel."
